name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Use LiteLLM's bundled price list: deterministic cost tests, no download.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      # Actions are pinned to a full commit SHA; the comment shows the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      # Integration tests and evals need Odoo and an LLM key; they run locally.
      - name: Fast tests
        run: uv run pytest -m "not integration and not evals"
